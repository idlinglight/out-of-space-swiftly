name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  DEVELOPER_ID_CA_URL: https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
  DEVELOPER_ID_CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a

defaults:
  run:
    shell: bash # adds -eo pipefail; the default macOS run shell omits pipefail

jobs:
  release:
    runs-on: xcode-27
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write # draft the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version && sw_vers

      - name: Tag matches the version
        run: |
          version=$(xcodebuild -project out-of-space-swiftly/out-of-space-swiftly.xcodeproj \
            -scheme out-of-space-swiftly -configuration Release -showBuildSettings 2>/dev/null \
            | sed -n '/^ *MARKETING_VERSION = /{s///p;q;}')
          case "$GITHUB_REF_NAME" in
            "v$version") echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
            "v$version"-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match the version $version (v$version or v$version-<suffix>)"
               exit 1 ;;
          esac

      - name: Job keychain with the signing identity and the notary key
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          curl -fsSL -o "$RUNNER_TEMP/developer-id-ca.cer" "$DEVELOPER_ID_CA_URL"
          echo "$DEVELOPER_ID_CA_SHA256  $RUNNER_TEMP/developer-id-ca.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/developer-id-ca.cer" -k "$keychain"

          printf '%s' "$MAC_CERT_P12" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '" ')
          identities=$(security find-identity -v -p codesigning "$keychain")
          echo "$identities"
          grep -q 'Developer ID Application' <<< "$identities" \
            || { echo "::error::MAC_CERT_P12 holds no valid Developer ID Application identity"; exit 1; }

          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials out-of-space-swiftly --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/notary.p8"
          echo "OOSS_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and check (Scripts/release.sh)
        run: Scripts/release.sh

      - name: Delete the job keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

      - name: Logs of a failed release
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs
          path: |
            build/release/*/*.log
            build/release/*/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          results=(build/release/*/*.dmg build/release/*/*.zip)
          [ "${#results[@]}" -eq 2 ] || { echo "::error::Expected one .dmg and one .zip, found: ${results[*]}"; exit 1; }
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Open the disk image and drag Out Of Space Swiftly to Applications. Needs macOS 26 or later."
            echo
            echo '```'
            for f in "${results[@]}"; do echo "$(shasum -a 256 "$f" | cut -d' ' -f1)  $(basename "$f")"; done
            echo '```'
          } > "$notes"
          flags=(--draft --verify-tag --generate-notes --notes-file "$notes"
                 --title "Out Of Space Swiftly ${GITHUB_REF_NAME#v}")
          [ "$PRERELEASE" = false ] || flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${results[@]}" "${flags[@]}"
